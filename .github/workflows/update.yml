name: Update playoff picture

on:
  schedule:
    - cron: "17 */2 * * *"     # every 2 hours
  workflow_dispatch:           # adds a "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install add-ons
        run: pip install pandas lxml requests

      - name: Get latest results (keeps the old games.csv for any sport the site can't serve)
        run: python scrape_cciw.py || echo "Scrape failed - using existing results"

      - name: Build the pages
        run: python make_page.py

      - name: Save changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add games.csv index.html wsoc volleyball
          git diff --cached --quiet || git commit -m "Update playoff pages"
          git push
